version: "1.0"
agent_id: "slack-morning-greeter"
agent_name: "Slack Morning Greeter"

categories:
  - category: "channel"
    label: "Channels"
    groups:
      - name: "Slack"
        icon: "💬"
        description: "Slack workspace for morning greeting delivery"
        vars:
          - key: SLACK_BOT_TOKEN
            label: "Bot Token"
            required: true
            secret: true
            help: "Create a Slack bot at https://api.slack.com/apps and install to workspace"
            placeholder: "xoxb-..."
          - key: SLACK_USER_ID
            label: "User ID"
            required: true
            secret: false
            help: "Find user ID by clicking user profile in Slack (e.g., U01234567)"
            placeholder: "U01234567"

  - category: "infrastructure"
    label: "Infrastructure"
    groups:
      - name: "Database"
        icon: "🗄️"
        description: "PostgreSQL for result storage (optional — agent works without it)"
        vars:
          - key: PG_CONNECTION_STRING
            label: "Connection String"
            required: false
            secret: true
            placeholder: "postgresql://user:pass@host:5432/dbname"
          - key: ORG_ID
            label: "Organisation ID"
            required: false
            secret: false
            default: "default"
          - key: AGENT_ID
            label: "Agent ID"
            required: false
            secret: false
            auto_fill: true
            default: "slack-morning-greeter"
