name: "slack-morning-greeter-workflow"
version: "1.0"
description: "Daily morning greeting via Slack DM at 10:00 AM UTC"

steps:
  - id: provision-schema
    type: skill
    skill: data-writer
    description: "Create database schema and tables (first run only)"
    action: provision

  - id: send-greeting
    type: native-tool
    tool: message
    description: "Send morning greeting via Slack DM"
    depends_on:
      - provision-schema
    params:
      action: "send"
      channel: "slack"
      target: "${SLACK_USER_ID}"
      message: "Good morning openclaw"

  - id: record-delivery
    type: skill
    skill: greeting-sender
    description: "Record delivery in database"
    depends_on:
      - send-greeting

  - id: write-results
    type: skill
    skill: data-writer
    description: "Finalize database writes"
    depends_on:
      - record-delivery
    action: query
