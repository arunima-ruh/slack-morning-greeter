name: slack-morning-greeter-workflow
description: "Send a simple good morning greeting to Slack every weekday at 10 AM IST"
version: "1.0.0"

steps:
  - id: provision-db
    type: skill
    skill: data-writer
    description: "Provision database schema (first run only)"
    command: "python3 scripts/data_writer.py provision"
    on_error: continue

  - id: compose-greeting
    type: skill
    skill: greeting-composer
    description: "Generate morning greeting message"
    depends_on: []

  - id: send-to-slack
    type: native_tool
    tool: message
    description: "Send greeting via Slack"
    depends_on: [compose-greeting]
    params:
      action: "send"
      channel: "slack"
      target: "${SLACK_CHANNEL}"
      message_file: "/tmp/greeting-composer_${RUN_ID}.json"

  - id: write-log
    type: skill
    skill: log-writer
    description: "Record delivery status to database"
    depends_on: [send-to-slack]
