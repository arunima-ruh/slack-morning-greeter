# result-schema.yml — Data contract for slack-morning-greeter
# This file defines what data this agent writes to PostgreSQL.
# Generated by the Agent Builder from the user-approved data schema.

version: "1.0"
agent_id: "slack-morning-greeter"
organisation_id: "${ORG_ID}"

tables:
  result_greeting_log:
    description: "Tracks each morning greeting sent to Slack"
    write_mode: upsert
    columns:
      - name: date_key
        type: VARCHAR(10)
        required: true
        description: "Date in YYYY-MM-DD format"
      - name: channel
        type: VARCHAR(100)
        required: true
        description: "Slack channel name or ID"
      - name: message_content
        type: TEXT
        required: true
        description: "The greeting message that was sent"
      - name: sent_at
        type: TIMESTAMPTZ
        required: true
        description: "Exact timestamp when message was sent"
      - name: status
        type: VARCHAR(20)
        required: true
        description: "Delivery status: sent, failed, skipped"
    conflict_columns:
      - date_key
    source_skill: log-writer
