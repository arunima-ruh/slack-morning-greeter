version: "1.0"
agent_id: "slack-morning-greeter"
agent_name: "Slack Morning Greeter"

tables:
  result_greeting_deliveries:
    description: "Records each greeting delivery with timestamp and status"
    write_mode: "upsert"
    columns:
      id:
        type: "uuid"
        primary_key: true
        description: "Unique record ID"
      date_key:
        type: "string"
        max_length: 10
        required: true
        description: "Date of the greeting (YYYY-MM-DD)"
      sent_at:
        type: "datetime"
        required: true
        description: "Exact timestamp when greeting was sent"
      message_text:
        type: "text"
        required: true
        description: "The greeting message that was sent"
      delivery_status:
        type: "string"
        max_length: 50
        required: true
        description: "Success or error status"
      run_id:
        type: "uuid"
        required: true
        description: "Execution run identifier"
      computed_at:
        type: "datetime"
        required: true
        description: "Timestamp when this record was written"
    conflict_columns:
      - "date_key"
